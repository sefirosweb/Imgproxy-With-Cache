services:
  app_imgproxy:
    image: "node:18-bullseye"
    # The entrypoint auto-installs fonts-dejavu-core at startup so sharp text overlays
    # render in dev too (image overlays don't need a font). Runs once per container.
    container_name: app_imgproxy
    hostname: app_imgproxy
    restart: always
    ports:
      - "${APP_PORT:-8080}:8080"
      - "${DEBUG_PORT:-9229}:9229"
    environment:
      APP_URL: "${APP_URL:-http://localhost:8080}"
      NODE_TLS_REJECT_UNAUTHORIZED: "0"
      USE_AWS_S3: "${USE_AWS_S3:-false}"
      AWS_REGION: "${AWS_REGION:-us-east-1}"
      AWS_BUCKET_NAME: "${AWS_BUCKET_NAME:-}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-}"

    volumes:
      - "./:/home/app"
    working_dir: /home/app
    entrypoint:
      - "bash"
      - "-c"
      - "apt-get update && apt-get install -y --no-install-recommends fonts-dejavu-core || echo 'WARN: font install failed; text overlays may render blank'; exec tail -f /dev/null"

  imgproxy:
    image: "darthsim/imgproxy"
    container_name: imgproxy
    hostname: imgproxy
    volumes:
      - "./media:/media"
    environment:
      IMGPROXY_LOCAL_FILESYSTEM_ROOT: /media
      IMGPROXY_MAX_SRC_RESOLUTION: "9999"
      IMGPROXY_USE_S3: "${USE_AWS_S3:-false}"
      AWS_REGION: "${AWS_REGION:-us-east-1}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-}"
