name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    name: Lint, type-check, build & test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (eslint + tsc + copy-assets)
        run: npm run build

      - name: Run tests
        run: npm test
